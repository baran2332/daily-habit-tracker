<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Habit Tracker</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Arka Plan Parlama Efektleri -->
  <div class="bg-glow blob-1"></div>
  <div class="bg-glow blob-2"></div>

  <div class="container">
    <!-- Üst Bar -->
    <div class="header">
      <div class="logo">
        <i class="fa-solid fa-calendar-check"></i>
        <span id="txt-app-title">Daily Habit Tracker</span>
      </div>
      <div class="controls">
        <div class="language-selector">
          <i class="fa-solid fa-globe"></i>
          <select id="langSelect" onchange="changeLanguage(this.value)">
            <option value="tr">Türkçe</option>
            <option value="en">English</option>
            <option value="fr">Français</option>
            <option value="de">Deutsch</option>
            <option value="es">Español</option>
            <option value="it">Italiano</option>
          </select>
        </div>
        <button onclick="toggleTheme()" class="theme-btn" id="themeBtn">🌙</button>
      </div>
    </div>

    <!-- Reklam Kaldırma Barı -->
    <div class="remove-ads-bar" id="removeAdsBar">
      <span><i class="fa-solid fa-crown"></i> <span id="txt-remove-ads-label">Reklamları Kaldır ($0.99)</span></span>
      <button class="remove-ads-btn" onclick="buyRemoveAds()" id="txt-buy-btn">Satın Al</button>
    </div>

    <!-- Etkinlik Ekleme Formu -->
    <div class="card">
      <div class="form-group">
        <label id="txt-label-habit"><i class="fa-solid fa-pen"></i> Etkinlik / Alışkanlık Adı</label>
        <input type="text" id="habitName" placeholder="...">
      </div>

      <div class="form-group">
        <label id="txt-label-times"><i class="fa-regular fa-clock"></i> Hatırlatma Saatleri (Çoklu Seçim)</label>
        <div id="timeList">
          <div class="time-row">
            <input type="time" class="habit-time-input" value="09:00">
          </div>
        </div>
        <button type="button" class="btn btn-outline btn-block" onclick="addTimeSlot()" id="txt-add-time-btn">+ Başka Saat Ekle</button>
      </div>

      <button type="button" class="btn btn-primary btn-block" onclick="saveHabit()" id="txt-save-btn">Etkinliği Kaydet</button>
    </div>

    <!-- Kayıtlı Etkinlikler Listesi -->
    <h3 style="margin-top: 25px; font-size: 16px;" id="txt-title-habits">Kayıtlı Etkinlikler</h3>
    <div id="habitList"></div>

    <!-- Banner Reklam Alanı -->
    <div class="ad-banner-area" id="adBannerArea">
      📢 <span id="txt-ad-placeholder">Sponsorlu Reklam Alanı (AdMob Banner)</span>
    </div>
  </div>

<script>
  let isAdsRemoved = localStorage.getItem('adsRemoved') === 'true';

  const translations = {
    tr: {
      appTitle: "Günlük Alışkanlık Takip",
      removeAdsLabel: "Reklamları Kaldır ($0.99)",
      buyBtn: "Satın Al",
      labelHabit: "Etkinlik / Alışkanlık Adı",
      labelTimes: "Hatırlatma Saatleri (Çoklu Seçim)",
      addTimeBtn: "+ Başka Saat Ekle",
      saveBtn: "Etkinliği ve Bildirimleri Kaydet",
      titleHabits: "Kayıtlı Etkinlikler",
      adPlaceholder: "Sponsorlu Reklam Alanı (AdMob Banner)",
      placeholderInput: "Örn: Kitap Oku, Su İç, Spor Yap",
      alertEmptyName: "Lütfen etkinlik adı girin.",
      alertEmptyTime: "Lütfen en az bir saat seçin.",
      alertSuccess: "Etkinlik ve bildirimler başarıyla kaydedildi!",
      adsPurchased: "Teşekkürler! Reklamlar başarıyla kaldırıldı."
    },
    en: {
      appTitle: "Daily Habit Tracker",
      removeAdsLabel: "Remove Ads ($0.99)",
      buyBtn: "Buy Now",
      labelHabit: "Habit / Task Name",
      labelTimes: "Reminder Times (Multiple)",
      addTimeBtn: "+ Add Another Time",
      saveBtn: "Save Habit & Notifications",
      titleHabits: "Saved Habits",
      adPlaceholder: "Sponsored Ad Space (AdMob Banner)",
      placeholderInput: "E.g. Read Book, Drink Water",
      alertEmptyName: "Please enter a habit name.",
      alertEmptyTime: "Please select at least one time slot.",
      alertSuccess: "Habit and notifications set successfully!",
      adsPurchased: "Thank you! Ads have been removed."
    },
    fr: {
      appTitle: "Suivi d'Habitudes",
      removeAdsLabel: "Supprimer les Pubs ($0.99)",
      buyBtn: "Acheter",
      labelHabit: "Nom de l'habitude",
      labelTimes: "Heures de rappel (Multiples)",
      addTimeBtn: "+ Ajouter une heure",
      saveBtn: "Enregistrer l'habitude",
      titleHabits: "Habitudes Enregistrées",
      adPlaceholder: "Espace Publicitaire (AdMob Banner)",
      placeholderInput: "Ex: Lire un livre, Boire de l'eau",
      alertEmptyName: "Veuillez entrer un nom d'habitude.",
      alertEmptyTime: "Veuillez sélectionner au moins une heure.",
      alertSuccess: "Habitude et notifications enregistrées avec succès!",
      adsPurchased: "Merci! Les publicités ont été supprimées."
    },
    de: {
      appTitle: "Täglicher Gewohnheits-Tracker",
      removeAdsLabel: "Werbung entfernen ($0.99)",
      buyBtn: "Kaufen",
      labelHabit: "Name der Gewohnheit",
      labelTimes: "Erinnerungszeiten (Mehrfach)",
      addTimeBtn: "+ Weitere Zeit hinzufügen",
      saveBtn: "Gewohnheit speichern",
      titleHabits: "Gespeicherte Gewohnheiten",
      adPlaceholder: "Werbefläche (AdMob Banner)",
      placeholderInput: "z.B. Buch lesen, Wasser trinken",
      alertEmptyName: "Bitte geben Sie einen Namen ein.",
      alertEmptyTime: "Bitte wählen Sie mindestens eine Uhrzeit.",
      alertSuccess: "Gewohnheit und Benachrichtigungen erfolgreich gespeichert!",
      adsPurchased: "Vielen Dank! Werbung wurde entfernt."
    },
    es: {
      appTitle: "Rastreador de Hábitos",
      removeAdsLabel: "Eliminar Anuncios ($0.99)",
      buyBtn: "Comprar",
      labelHabit: "Nombre del Hábito",
      labelTimes: "Horarios de Recordatorio",
      addTimeBtn: "+ Agregar otra hora",
      saveBtn: "Guardar Hábito",
      titleHabits: "Hábitos Guardados",
      adPlaceholder: "Espacio Publicitario (AdMob Banner)",
      placeholderInput: "Ej. Leer libro, Beber agua",
      alertEmptyName: "Por favor ingrese un nombre.",
      alertEmptyTime: "Por favor seleccione al menos una hora.",
      alertSuccess: "¡Hábito y notificaciones guardados con éxito!",
      adsPurchased: "¡Gracias! Se han eliminado los anuncios."
    },
    it: {
      appTitle: "Tracker Abitudini Giornaliere",
      removeAdsLabel: "Rimuovi Pubblicità ($0.99)",
      buyBtn: "Acquista",
      labelHabit: "Nome dell'Abitudine",
      labelTimes: "Orari dei Promemoria",
      addTimeBtn: "+ Aggiungi un altro orario",
      saveBtn: "Salva Abitudine",
      titleHabits: "Abitudini Salvate",
      adPlaceholder: "Spazio Pubblicitario (AdMob Banner)",
      placeholderInput: "Es. Leggere libro, Bere acqua",
      alertEmptyName: "Per favore inserisci un nome.",
      alertEmptyTime: "Seleziona almeno un orario.",
      alertSuccess: "Abitudine e notifiche salvate con successo!",
      adsPurchased: "Grazie! Le pubblicità sono state rimosse."
    }
  };

  let currentLang = localStorage.getItem('appLang') || 'tr';

  function applyLanguage(lang) {
    currentLang = lang;
    localStorage.setItem('appLang', lang);
    document.getElementById('langSelect').value = lang;
    
    const t = translations[lang] || translations['tr'];
    document.getElementById('txt-app-title').innerText = t.appTitle;
    document.getElementById('txt-remove-ads-label').innerText = t.removeAdsLabel;
    document.getElementById('txt-buy-btn').innerText = t.buyBtn;
    document.getElementById('txt-label-habit').innerText = t.labelHabit;
    document.getElementById('txt-label-times').innerText = t.labelTimes;
    document.getElementById('txt-add-time-btn').innerText = t.addTimeBtn;
    document.getElementById('txt-save-btn').innerText = t.saveBtn;
    document.getElementById('txt-title-habits').innerText = t.titleHabits;
    document.getElementById('txt-ad-placeholder').innerText = t.adPlaceholder;
    document.getElementById('habitName').placeholder = t.placeholderInput;
  }

  function changeLanguage(lang) { applyLanguage(lang); }

  function toggleTheme() {
    const html = document.documentElement;
    const currentTheme = html.getAttribute('data-theme');
    const newTheme = currentTheme === 'light' ? 'dark' : 'light';
    html.setAttribute('data-theme', newTheme);
    document.getElementById('themeBtn').innerText = newTheme === 'light' ? '🌙' : '☀️';
    localStorage.setItem('appTheme', newTheme);
  }

  function initTheme() {
    const savedTheme = localStorage.getItem('appTheme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    document.getElementById('themeBtn').innerText = savedTheme === 'light' ? '🌙' : '☀️';
  }

  function addTimeSlot() {
    const container = document.getElementById('timeList');
    const div = document.createElement('div');
    div.className = 'time-row';
    div.innerHTML = `
      <input type="time" class="habit-time-input" value="12:00">
      <button type="button" class="remove-time-btn" onclick="this.parentElement.remove()">X</button>
    `;
    container.appendChild(div);
  }

  async function scheduleNotification(title, timeStr) {
    if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.LocalNotifications) {
      const { LocalNotifications } = window.Capacitor.Plugins;
      try {
        await LocalNotifications.requestPermissions();
        const [hours, minutes] = timeStr.split(':').map(Number);
        const now = new Date();
        const scheduledDate = new Date();
        scheduledDate.setHours(hours, minutes, 0, 0);
        if (scheduledDate <= now) scheduledDate.setDate(scheduledDate.getDate() + 1);

        await LocalNotifications.schedule({
          notifications: [{
            title: "Hatırlatıcı: " + title,
            body: timeStr + " - Etkinlik Zamanı!",
            id: Math.floor(Math.random() * 1000000),
            schedule: { at: scheduledDate }
          }]
        });
      } catch (err) { console.log("Notification Error:", err); }
    }
  }

  async function saveHabit() {
    const name = document.getElementById('habitName').value.trim();
    const t = translations[currentLang] || translations['tr'];
    if (!name) return alert(t.alertEmptyName);

    const timeInputs = document.querySelectorAll('.habit-time-input');
    const times = [];
    for (let input of timeInputs) {
      if (input.value) {
        times.push(input.value);
        await scheduleNotification(name, input.value);
      }
    }
    if (times.length === 0) return alert(t.alertEmptyTime);

    const habitList = document.getElementById('habitList');
    const card = document.createElement('div');
    card.className = 'habit-card';
    card.innerHTML = `
      <div>
        <div class="habit-title">${name}</div>
        <div class="habit-times"><i class="fa-regular fa-clock"></i> ${times.join(', ')}</div>
      </div>
      <span style="color: var(--primary); font-weight: bold;">✓</span>
    `;
    habitList.appendChild(card);
    document.getElementById('habitName').value = '';
    alert(t.alertSuccess);
  }

  function buyRemoveAds() {
    const t = translations[currentLang] || translations['tr'];
    localStorage.setItem('adsRemoved', 'true');
    isAdsRemoved = true;
    checkAdsStatus();
    alert(t.adsPurchased);
  }

  function checkAdsStatus() {
    if (isAdsRemoved) {
      document.getElementById('removeAdsBar').style.display = 'none';
      document.getElementById('adBannerArea').style.display = 'none';
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    initTheme();
    applyLanguage(currentLang);
    checkAdsStatus();
  });
</script>
</body>
</html>
