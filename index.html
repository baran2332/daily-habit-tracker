<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly & Long-Term Habit Tracker</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Arka Plan Parlama Efektleri -->
  <div class="bg-glow blob-1"></div>
  <div class="bg-glow blob-2"></div>

  <div class="container">
    <!-- Üst Bar -->
    <div class="header">
      <div class="logo">
        <i class="fa-solid fa-calendar-week"></i>
        <span id="txt-app-title">Plan Tracker</span>
      </div>
      <div class="controls">
        <div class="language-selector">
          <i class="fa-solid fa-globe"></i>
          <select id="langSelect" onchange="changeLanguage(this.value)">
            <option value="tr">Türkçe</option>
            <option value="en">English</option>
            <option value="fr">Français</option>
            <option value="de">Deutsch</option>
            <option value="es">Español</option>
            <option value="it">Italiano</option>
          </select>
        </div>
        <button onclick="toggleTheme()" class="theme-btn" id="themeBtn">🌙</button>
      </div>
    </div>

    <!-- Reklam Kaldırma Barı -->
    <div class="remove-ads-bar" id="removeAdsBar">
      <span><i class="fa-solid fa-crown"></i> <span id="txt-remove-ads-label">Reklamları Kaldır ($0.99)</span></span>
      <button class="remove-ads-btn" onclick="buyRemoveAds()" id="txt-buy-btn">Satın Al</button>
    </div>

    <!-- Plan Ekleme Kartı -->
    <div class="card">
      <div class="form-group">
        <label id="txt-label-habit"><i class="fa-solid fa-pen"></i> Plan / Alışkanlık Adı</label>
        <input type="text" id="habitName" placeholder="...">
      </div>

      <!-- Tekrarlama Türü -->
      <div class="form-group">
        <label id="txt-label-repeat"><i class="fa-solid fa-arrows-rotate"></i> Tekrar Türü</label>
        <select id="repeatType" onchange="toggleRepeatOptions(this.value)" class="styled-select">
          <option value="everyday">Her Gün (Sürekli)</option>
          <option value="weekly">Haftanın Belirli Günleri</option>
        </select>
      </div>

      <!-- Haftalık Gün Seçimi (Gizlenebilir) -->
      <div class="form-group" id="daysSelectorGroup" style="display: none;">
        <label id="txt-label-days"><i class="fa-regular fa-calendar-check"></i> Günleri Seçin</label>
        <div class="days-grid">
          <button type="button" class="day-chip" data-day="1" onclick="toggleDayChip(this)">Pzt</button>
          <button type="button" class="day-chip" data-day="2" onclick="toggleDayChip(this)">Sal</button>
          <button type="button" class="day-chip" data-day="3" onclick="toggleDayChip(this)">Çar</button>
          <button type="button" class="day-chip" data-day="4" onclick="toggleDayChip(this)">Per</button>
          <button type="button" class="day-chip" data-day="5" onclick="toggleDayChip(this)">Cum</button>
          <button type="button" class="day-chip" data-day="6" onclick="toggleDayChip(this)">Cmt</button>
          <button type="button" class="day-chip" data-day="0" onclick="toggleDayChip(this)">Paz</button>
        </div>
      </div>

      <!-- Tarih Aralığı (İsteğe Bağlı) -->
      <div class="form-group">
        <div class="checkbox-row">
          <input type="checkbox" id="enableDateRange" onchange="toggleDateInputs(this.checked)">
          <label for="enableDateRange" id="txt-label-enable-dates" style="margin-bottom:0; cursor:pointer;">Belirli Bir Tarih Aralığında Çalışsın</label>
        </div>
        <div class="date-row" id="dateInputsGroup" style="display: none; margin-top: 10px;">
          <div>
            <span class="sub-label" id="txt-label-start">Başlangıç:</span>
            <input type="date" id="startDate">
          </div>
          <div>
            <span class="sub-label" id="txt-label-end">Bitiş:</span>
            <input type="date" id="endDate">
          </div>
        </div>
      </div>

      <!-- Hatırlatma Saatleri -->
      <div class="form-group">
        <label id="txt-label-times"><i class="fa-regular fa-clock"></i> Hatırlatma Saatleri</label>
        <div id="timeList">
          <div class="time-row">
            <input type="time" class="habit-time-input" value="09:00">
          </div>
        </div>
        <button type="button" class="btn btn-outline btn-block" onclick="addTimeSlot()" id="txt-add-time-btn">+ Başka Saat Ekle</button>
      </div>

      <button type="button" class="btn btn-primary btn-block" onclick="saveHabit()" id="txt-save-btn">Planı Kaydet</button>
    </div>

    <!-- Kayıtlı Planlar -->
    <h3 style="margin-top: 25px; font-size: 16px;" id="txt-title-habits">Aktif Planlarım</h3>
    <div id="habitList"></div>

    <!-- Banner Reklam Alanı -->
    <div class="ad-banner-area" id="adBannerArea">
      📢 <span id="txt-ad-placeholder">Sponsorlu Reklam Alanı (AdMob Banner)</span>
    </div>
  </div>

      adPlaceholder: "Spazio Pubblicitario (AdMob)",
      placeholderInput: "Es. Leggere, Palestra, Studiare",
      alertEmptyName: "Inserisci un nome.",
      alertEmptyDays: "Seleziona almeno un giorno.",
      alertEmptyTime: "Seleziona almeno un orario.",
      alertSuccess: "Piano salvato con successo!",
      adsPurchased: "Grazie! Pubblicità rimosse.",
      daysShort: ["Dom", "Lun", "Mar", "Mer", "Gio", "Ven", "Sab"],
      always: "Continuo (Senza fine)",
      deleteBtn: "Elimina"

  };

  let currentLang = localStorage.getItem('appLang') || 'tr';

  function applyLanguage(lang) {
    currentLang = lang;
    localStorage.setItem('appLang', lang);
    document.getElementById('langSelect').value = lang;
    
    const t = translations[lang] || translations['tr'];
    document.getElementById('txt-app-title').innerText = t.appTitle;
    document.getElementById('txt-remove-ads-label').innerText = t.removeAdsLabel;
    document.getElementById('txt-buy-btn').innerText = t.buyBtn;
    document.getElementById('txt-label-habit').innerText = t.labelHabit;
    document.getElementById('txt-label-repeat').innerText = t.labelRepeat;
    document.getElementById('txt-label-days').innerText = t.labelDays;
    document.getElementById('txt-label-enable-dates').innerText = t.labelEnableDates;
    document.getElementById('txt-label-start').innerText = t.labelStart;
    document.getElementById('txt-label-end').innerText = t.labelEnd;
    document.getElementById('txt-label-times').innerText = t.labelTimes;
    document.getElementById('txt-add-time-btn').innerText = t.addTimeBtn;
    document.getElementById('txt-save-btn').innerText = t.saveBtn;
    document.getElementById('txt-title-habits').innerText = t.titleHabits;
    document.getElementById('txt-ad-placeholder').innerText = t.adPlaceholder;
    document.getElementById('habitName').placeholder = t.placeholderInput;

    // Gün Butonlarını Güncelle
    const dayChips = document.querySelectorAll('.day-chip');
    dayChips.forEach(chip => {
      const dayIdx = parseInt(chip.getAttribute('data-day'));
      chip.innerText = t.daysShort[dayIdx];
    });

    renderHabits();
  }

  function changeLanguage(lang) { applyLanguage(lang); }

  function toggleTheme() {
    const html = document.documentElement;
    const currentTheme = html.getAttribute('data-theme');
    const newTheme = currentTheme === 'light' ? 'dark' : 'light';
    html.setAttribute('data-theme', newTheme);
    document.getElementById('themeBtn').innerText = newTheme === 'light' ? '🌙' : '☀️';
    localStorage.setItem('appTheme', newTheme);
  }

  function initTheme() {
    const savedTheme = localStorage.getItem('appTheme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    document.getElementById('themeBtn').innerText = savedTheme === 'light' ? '🌙' : '☀️';
  }

  function toggleRepeatOptions(val) {
    document.getElementById('daysSelectorGroup').style.display = val === 'weekly' ? 'block' : 'none';
  }

  function toggleDateInputs(checked) {
    document.getElementById('dateInputsGroup').style.display = checked ? 'flex' : 'none';
  }

  function toggleDayChip(btn) {
    btn.classList.toggle('active');
  }

  function addTimeSlot() {
    const container = document.getElementById('timeList');
    const div = document.createElement('div');
    div.className = 'time-row';
    div.innerHTML = `
      <input type="time" class="habit-time-input" value="12:00">
      <button type="button" class="remove-time-btn" onclick="this.parentElement.remove()">X</button>
    `;
    container.appendChild(div);
  }

  async function scheduleNotifications(habit) {
    if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.LocalNotifications) {
      const { LocalNotifications } = window.Capacitor.Plugins;
      try {
        await LocalNotifications.requestPermissions();
        // Capacitor yerel bildirim kurma
        for (let timeStr of habit.times) {
          const [hours, minutes] = timeStr.split(':').map(Number);
          await LocalNotifications.schedule({
            notifications: [{
              title: "Plan Zamanı: " + habit.name,
              body: `${timeStr} - ${habit.name} zamanı geldi!`,
              id: Math.floor(Math.random() * 1000000),
              schedule: { on: { hour: hours, minute: minutes }, repeats: true }
            }]
          });
        }
      } catch (err) { console.log("Notification Error:", err); }
    }
  }

  function saveHabit() {
    const name = document.getElementById('habitName').value.trim();
    const repeatType = document.getElementById('repeatType').value;
    const t = translations[currentLang] || translations['tr'];

    if (!name) return alert(t.alertEmptyName);

    let selectedDays = [];
    if (repeatType === 'weekly') {
      document.querySelectorAll('.day-chip.active').forEach(chip => {
        selectedDays.push(parseInt(chip.getAttribute('data-day')));
      });
      if (selectedDays.length === 0) return alert(t.alertEmptyDays);
    } else {
      selectedDays = [0,1,2,3,4,5,6]; // Her gün
    }

    const hasDateRange = document.getElementById('enableDateRange').checked;
    const startDate = hasDateRange ? document.getElementById('startDate').value : null;
    const endDate = hasDateRange ? document.getElementById('endDate').value : null;

    const timeInputs = document.querySelectorAll('.habit-time-input');
    const times = [];
    timeInputs.forEach(input => { if (input.value) times.push(input.value); });

    if (times.length === 0) return alert(t.alertEmptyTime);

    const newHabit = {
      id: Date.now(),
      name,
      repeatType,
      selectedDays,
      hasDateRange,
      startDate,
      endDate,
      times
    };

    habits.push(newHabit);
    localStorage.setItem('userHabits', JSON.stringify(habits));
    scheduleNotifications(newHabit);

    // Formu temizle
    document.getElementById('habitName').value = '';
    document.querySelectorAll('.day-chip').forEach(c => c.classList.remove('active'));
    alert(t.alertSuccess);
    renderHabits();
  }

  function deleteHabit(id) {
    habits = habits.filter(h => h.id !== id);
    localStorage.setItem('userHabits', JSON.stringify(habits));
    renderHabits();
  }

  function renderHabits() {
    const habitList = document.getElementById('habitList');
    habitList.innerHTML = '';
    const t = translations[currentLang] || translations['tr'];

    habits.forEach(h => {
      const card = document.createElement('div');
      card.className = 'habit-card';

      let daysText = "";
      if (h.repeatType === 'everyday') {
        daysText = t.optEveryday;
      } else {
        daysText = h.selectedDays.map(d => t.daysShort[d]).join(', ');
      }

      let dateText = h.hasDateRange && h.startDate && h.endDate ? `${h.startDate} ➔ ${h.endDate}` : t.always;

      card.innerHTML = `
        <div style="flex: 1;">
          <div class="habit-title">${h.name}</div>
          <div class="habit-details">
            <div><i class="fa-solid fa-repeat"></i> ${daysText}</div>
            <div><i class="fa-regular fa-clock"></i> ${h.times.join(', ')}</div>
            <div><i class="fa-regular fa-calendar"></i> ${dateText}</div>
          </div>
        </div>
        <button class="delete-btn" onclick="deleteHabit(${h.id})"><i class="fa-solid fa-trash"></i></button>
      `;
      habitList.appendChild(card);
    });
  }

  function buyRemoveAds() {
    const t = translations[currentLang] || translations['tr'];
    localStorage.setItem('adsRemoved', 'true');
    isAdsRemoved = true;
    checkAdsStatus();
    alert(t.adsPurchased);
  }

  function checkAdsStatus() {
    if (isAdsRemoved) {
      document.getElementById('removeAdsBar').style.display = 'none';
      document.getElementById('adBannerArea').style.display = 'none';
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    initTheme();
    applyLanguage(currentLang);
    checkAdsStatus();
    
    // Varsayılan bugünün tarihini koy
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('startDate').value = today;
  });
</script>
