<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pratik Planlayıcı</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <i class="fa-solid fa-calendar-check"></i>
        <span id="txt-app-title">Pratik Planlayıcı</span>
      </div>
      <div class="header-actions">
        <select id="langSelect" onchange="changeLanguage(this.value)" class="sm-select">
          <option value="tr">TR</option>
          <option value="en">EN</option>
          <option value="fr">FR</option>
          <option value="de">DE</option>
          <option value="es">ES</option>
          <option value="it">IT</option>
        </select>
        <button onclick="toggleTheme()" class="icon-btn" id="themeBtn">🌙</button>
      </div>
    </header>

    <!-- Reklam Barı -->
    <div class="ad-bar" id="removeAdsBar">
      <span>👑 <span id="txt-remove-ads">Reklamları Kaldır</span></span>
      <button onclick="buyRemoveAds()" class="btn-xs" id="txt-buy">Satın Al</button>
    </div>

    <!-- HIZLI ÖRNEK RUTİNLER (KISAYOLLAR) -->
    <div class="quick-shortcuts">
      <span class="quick-label"><i class="fa-solid fa-bolt"></i> Hızlı Kısayollar:</span>
      <button type="button" class="quick-btn" onclick="addWaterRoutine()">💧 2 Saatte Bir Su</button>
      <button type="button" class="quick-btn" onclick="addMealRoutine()">🍲 5 Saatte Bir Yemek</button>
    </div>

    <!-- HIZLI PLAN EKLEME FORMU -->
    <section class="card form-card">
      <div class="type-selector">
        <label class="radio-label">
          <input type="radio" name="planType" value="weekly" checked onclick="toggleFormMode('weekly')">
          <span id="txt-opt-weekly">Haftalık Rutin</span>
        </label>
        <label class="radio-label">
          <input type="radio" name="planType" value="date" onclick="toggleFormMode('date')">
          <span id="txt-opt-date">Tarihli / Uzun Plan</span>
        </label>
      </div>

      <div class="input-group">
        <input type="text" id="planTitle" placeholder="Plan veya rutin adı..." autofocus>
      </div>

      <!-- HAFTALIK GÜN SEÇİMİ (Rutin Modu) -->
      <div id="weeklyDaysArea" class="days-row">
        <button type="button" class="chip" data-day="1" onclick="toggleChip(this)">Pzt</button>
        <button type="button" class="chip" data-day="2" onclick="toggleChip(this)">Sal</button>
        <button type="button" class="chip" data-day="3" onclick="toggleChip(this)">Çar</button>
        <button type="button" class="chip" data-day="4" onclick="toggleChip(this)">Per</button>
        <button type="button" class="chip" data-day="5" onclick="toggleChip(this)">Cum</button>
        <button type="button" class="chip" data-day="6" onclick="toggleChip(this)">Cmt</button>
        <button type="button" class="chip" data-day="0" onclick="toggleChip(this)">Paz</button>
      </div>

      <!-- TARİH ARALIĞI SEÇİMİ (Tarihli Mod) -->
      <div id="dateRangeArea" class="dates-row" style="display: none;">
        <input type="date" id="startDate">
        <span>→</span>
        <input type="date" id="endDate">
      </div>

      <div class="form-footer">
        <div class="time-picker">
          <i class="fa-regular fa-clock"></i>
          <input type="time" id="planTime" value="09:00">
        </div>
        <button onclick="savePlan()" class="btn-primary" id="txt-add-btn">+ Ekle</button>
      </div>
    </section>

    <!-- TÜM HAFTAYI KAPSAYAN TAKVİM TABLOSU -->
    <section class="card flow-card">
      <div class="flow-header">
        <div class="flow-title">
          <i class="fa-solid fa-calendar-week"></i>
          <span id="txt-flow-title">Haftalık Görünüm</span>
        </div>
        <div class="week-picker">
          <button onclick="changeWeek(-1)" class="icon-btn-sm"><i class="fa-solid fa-chevron-left"></i></button>
          <span id="currentWeekRange" class="week-range-text"></span>
          <button onclick="changeWeek(1)" class="icon-btn-sm"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
      </div>

      <!-- 7 Günlük Haftalık Izgara -->
      <div id="weeklyGrid" class="weekly-grid"></div>
    </section>

    <!-- AdMob Reklam Alanı -->
    <div class="ad-placeholder" id="adBannerArea">
      <span id="txt-ad-text">📢 Sponsorlu Reklam Alanı</span>
    </div>
  </div>

<script>
  let isAdsRemoved = localStorage.getItem('adsRemoved') === 'true';
  let weeklyRoutines = JSON.parse(localStorage.getItem('weeklyRoutines') || '[]');
  let datePlans = JSON.parse(localStorage.getItem('datePlans') || '[]');
  let completedItems = JSON.parse(localStorage.getItem('completedItems') || '{}');

  let currentWeekStart = getMonday(new Date());

  const translations = {
    tr: {
      title: "Pratik Planlayıcı",
      removeAds: "Reklamları Kaldır ($0.99)",
      buy: "Satın Al",
      optWeekly: "Haftalık Rutin",
      optDate: "Tarihli / Uzun Plan",
      placeholder: "Plan veya rutin adı...",
      addBtn: "+ Ekle",
      flowTitle: "Haftalık Görünüm",
      adText: "📢 Sponsorlu Reklam Alanı",
      days: ["Paz", "Pzt", "Sal", "Çar", "Per", "Cum", "Cmt"],
      emptyDay: "Plan yok",
      fillAlert: "Lütfen başlık ve gerekli alanları doldurun."
    },
    en: {
      title: "Simple Planner",
      removeAds: "Remove Ads ($0.99)",
      buy: "Buy",
      optWeekly: "Weekly Routine",
      optDate: "Dated / Long Plan",
      placeholder: "Plan or routine name...",
      addBtn: "+ Add",
      flowTitle: "Weekly View",
      adText: "📢 Sponsored Ad Area",
      days: ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"],
      emptyDay: "No plan",
      fillAlert: "Please fill in title and required fields."
    }
  };

  let currentLang = localStorage.getItem('appLang') || 'tr';

  function getMonday(d) {
    d = new Date(d);
    let day = d.getDay(), diff = d.getDate() - day + (day === 0 ? -6 : 1);
    return new Date(d.setDate(diff));
  }

  function applyLanguage(lang) {
    currentLang = lang;
    localStorage.setItem('appLang', lang);
    document.getElementById('langSelect').value = lang;
    const t = translations[lang] || translations['tr'];

    document.getElementById('txt-app-title').innerText = t.title;
    document.getElementById('txt-remove-ads').innerText = t.removeAds;
    document.getElementById('txt-buy').innerText = t.buy;
    document.getElementById('txt-opt-weekly').innerText = t.optWeekly;
    document.getElementById('txt-opt-date').innerText = t.optDate;
    document.getElementById('planTitle').placeholder = t.placeholder;
    document.getElementById('txt-add-btn').innerText = t.addBtn;
    document.getElementById('txt-flow-title').innerText = t.flowTitle;
    document.getElementById('txt-ad-text').innerText = t.adText;

    document.querySelectorAll('.chip').forEach(chip => {
      chip.innerText = t.days[parseInt(chip.getAttribute('data-day'))];
    });

    renderWeeklyGrid();
  }

  function changeLanguage(lang) { applyLanguage(lang); }

  function toggleTheme() {
    const html = document.documentElement;
    const isLight = html.getAttribute('data-theme') === 'light';
    const newTheme = isLight ? 'dark' : 'light';
    html.setAttribute('data-theme', newTheme);
    document.getElementById('themeBtn').innerText = isLight ? '🌙' : '☀️';
    localStorage.setItem('appTheme', newTheme);
  }

  function initTheme() {
    const theme = localStorage.getItem('appTheme') || 'dark';
    document.documentElement.setAttribute('data-theme', theme);
    document.getElementById('themeBtn').innerText = theme === 'light' ? '🌙' : '☀️';
  }

  function toggleFormMode(mode) {
    if (mode === 'weekly') {
      document.getElementById('weeklyDaysArea').style.display = 'flex';
      document.getElementById('dateRangeArea').style.display = 'none';
    } else {
      document.getElementById('weeklyDaysArea').style.display = 'none';
      document.getElementById('dateRangeArea').style.display = 'flex';
    }
  }

  function toggleChip(btn) { btn.classList.toggle('active'); }

  // Hızlı Su Takibi Ekleme
  function addWaterRoutine() {
    weeklyRoutines.push({ id: 'w_' + Date.now(), title: '💧 Su İç (2 Saat)', days: [1,2,3,4,5,6,0], time: '10:00' });
    localStorage.setItem('weeklyRoutines', JSON.stringify(weeklyRoutines));
    renderWeeklyGrid();
  }

  // Hızlı Yemek Takibi Ekleme
  function addMealRoutine() {
    weeklyRoutines.push({ id: 'w_' + Date.now(), title: '🍲 Yemek Öğünü (5 Saat)', days: [1,2,3,4,5,6,0], time: '13:00' });
    localStorage.setItem('weeklyRoutines', JSON.stringify(weeklyRoutines));
    renderWeeklyGrid();
  }

  function savePlan() {
    const mode = document.querySelector('input[name="planType"]:checked').value;
    const title = document.getElementById('planTitle').value.trim();
    const time = document.getElementById('planTime').value;
    const t = translations[currentLang] || translations['tr'];

    if (!title || !time) return alert(t.fillAlert);

    if (mode === 'weekly') {
      let days = [];
      document.querySelectorAll('.chip.active').forEach(c => days.push(parseInt(c.getAttribute('data-day'))));
      if (days.length === 0) return alert(t.fillAlert);

      weeklyRoutines.push({ id: 'w_' + Date.now(), title, days, time });
      localStorage.setItem('weeklyRoutines', JSON.stringify(weeklyRoutines));
    } else {
      const startDate = document.getElementById('startDate').value;
      const endDate = document.getElementById('endDate').value;
      if (!startDate || !endDate) return alert(t.fillAlert);

      datePlans.push({ id: 'd_' + Date.now(), title, startDate, endDate, time });
      localStorage.setItem('datePlans', JSON.stringify(datePlans));
    }

    document.getElementById('planTitle').value = '';
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    renderWeeklyGrid();
  }

  function toggleDone(dateStr, itemId) {
    const key = `${dateStr}_${itemId}`;
    completedItems[key] = !completedItems[key];
    localStorage.setItem('completedItems', JSON.stringify(completedItems));
    renderWeeklyGrid();
  }

  function deleteItem(type, id) {
    if (type === 'weekly') {
      weeklyRoutines = weeklyRoutines.filter(r => r.id !== id);
      localStorage.setItem('weeklyRoutines', JSON.stringify(weeklyRoutines));
    } else {
      datePlans = datePlans.filter(p => p.id !== id);
      localStorage.setItem('datePlans', JSON.stringify(datePlans));
    }
    renderWeeklyGrid();
  }

  function selectDateForPlan(dateStr, dayIndex) {
    // Tıklanan günü formda otomatik seç
    document.querySelector('input[value="date"]').checked = true;
    toggleFormMode('date');
    document.getElementById('startDate').value = dateStr;
    document.getElementById('endDate').value = dateStr;
    
    // Ayrıca haftalık gün butonunu da aktif yap (eğer rutine geçerse diye)
    document.querySelectorAll('.chip').forEach(c => {
      c.classList.remove('active');
      if (parseInt(c.getAttribute('data-day')) === dayIndex) c.classList.add('active');
    });

    document.getElementById('planTitle').focus();
  }

  function changeWeek(direction) {
    currentWeekStart.setDate(currentWeekStart.getDate() + (direction * 7));
    renderWeeklyGrid();
  }

  function renderWeeklyGrid() {
    const grid = document.getElementById('weeklyGrid');
    grid.innerHTML = '';
    const t = translations[currentLang] || translations['tr'];

    let weekEnd = new Date(currentWeekStart);
    weekEnd.setDate(weekEnd.getDate() + 6);

    document.getElementById('currentWeekRange').innerText = 
      `${currentWeekStart.getDate()} - ${weekEnd.getDate()} ${currentWeekStart.toLocaleString('default', { month: 'short' })}`;

    // 7 Gün İçin Döngü (Pazartesi'den Pazar'a)
    for (let i = 0; i < 7; i++) {
      let loopDate = new Date(currentWeekStart);
      loopDate.setDate(loopDate.getDate() + i);

      let dateStr = loopDate.toISOString().split('T')[0];
      let dayIndex = loopDate.getDay();

      let dayItems = [];

      // Rutinler
      weeklyRoutines.forEach(r => {
        if (r.days.includes(dayIndex)) {
          dayItems.push({ id: r.id, type: 'weekly', title: r.title, time: r.time });
        }
      });

      // Tarihli Planlar
      datePlans.forEach(p => {
        if (dateStr >= p.startDate && dateStr <= p.endDate) {
          dayItems.push({ id: p.id, type: 'date', title: p.title, time: p.time });
        }
      });

      dayItems.sort((a, b) => a.time.localeCompare(b.time));

      // Gün Kartı Oluşturma
      const dayCard = document.createElement('div');
      dayCard.className = 'day-card';
      
      let dayHeader = `
        <div class="day-card-header" onclick="selectDateForPlan('${dateStr}', ${dayIndex})">
          <span class="day-name">${t.days[dayIndex]}</span>
          <span class="day-date">${loopDate.getDate()}</span>
        </div>
      `;

      let dayBody = `<div class="day-card-body">`;

      if (dayItems.length === 0) {
        dayBody += `<div class="empty-day-text">${t.emptyDay}</div>`;
      } else {
        dayItems.forEach(item => {
          const isDone = !!completedItems[`${dateStr}_${item.id}`];
          dayBody += `
            <div class="mini-item ${isDone ? 'done' : ''}">
              <button class="mini-check" onclick="toggleDone('${dateStr}', '${item.id}')">
                <i class="fa-solid ${isDone ? 'fa-circle-check' : 'fa-circle'}"></i>
              </button>
              <span class="mini-time">${item.time}</span>
              <span class="mini-title">${item.title}</span>
              <button class="mini-del" onclick="deleteItem('${item.type}', '${item.id}')">×</button>
            </div>
          `;
        });
      }

      dayBody += `</div>`;
      dayCard.innerHTML = dayHeader + dayBody;
      grid.appendChild(dayCard);
    }
  }

  function buyRemoveAds() {
    localStorage.setItem('adsRemoved', 'true');
    isAdsRemoved = true;
    checkAdsStatus();
  }

  function checkAdsStatus() {
    if (isAdsRemoved) {
      document.getElementById('removeAdsBar').style.display = 'none';
      document.getElementById('adBannerArea').style.display = 'none';
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    initTheme();
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('startDate').value = today;
    document.getElementById('endDate').value = today;

    applyLanguage(currentLang);
    checkAdsStatus();
  });
</script>
</body>
</html>
