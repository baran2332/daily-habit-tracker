<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gelişmiş Plan & Rutin Takip</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <div class="bg-glow blob-1"></div>
  <div class="bg-glow blob-2"></div>

  <div class="container">
    <!-- Üst Bar -->
    <div class="header">
      <div class="logo">
        <i class="fa-solid fa-calendar-days"></i>
        <span id="txt-app-title">Plan & Rutin Takip</span>
      </div>
      <div class="controls">
        <div class="language-selector">
          <i class="fa-solid fa-globe"></i>
          <select id="langSelect" onchange="changeLanguage(this.value)">
            <option value="tr">Türkçe</option>
            <option value="en">English</option>
            <option value="fr">Français</option>
            <option value="de">Deutsch</option>
            <option value="es">Español</option>
            <option value="it">Italiano</option>
          </select>
        </div>
        <button onclick="toggleTheme()" class="theme-btn" id="themeBtn">🌙</button>
      </div>
    </div>

    <!-- Reklam Barı -->
    <div class="remove-ads-bar" id="removeAdsBar">
      <span><i class="fa-solid fa-crown"></i> <span id="txt-remove-ads-label">Reklamları Kaldır ($0.99)</span></span>
      <button class="remove-ads-btn" onclick="buyRemoveAds()" id="txt-buy-btn">Satın Al</button>
    </div>

    <!-- TAB / SEKMELER -->
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('weeklyTab')" id="btn-tab-weekly"><i class="fa-solid fa-arrows-rotate"></i> Haftalık Rutinler</button>
      <button class="tab-btn" onclick="switchTab('dateTab')" id="btn-tab-date"><i class="fa-regular fa-calendar-plus"></i> Tarihli / Uzun Planlar</button>
    </div>

    <!-- TAB 1: HAFTALIK RUTİN EKLEME TABLOSU -->
    <div id="weeklyTab" class="tab-content active">
      <div class="card">
        <div class="form-group">
          <label id="txt-label-routine-name"><i class="fa-solid fa-pen"></i> Rutin Adı</label>
          <input type="text" id="weeklyName" placeholder="Örn: Spor, Ders Çalışma, Kitap Oku">
        </div>
        <div class="form-group">
          <label id="txt-label-select-days"><i class="fa-regular fa-calendar-check"></i> Haftalık Gün Seçimi</label>
          <div class="days-grid">
            <button type="button" class="day-chip" data-day="1" onclick="toggleDayChip(this)">Pzt</button>
            <button type="button" class="day-chip" data-day="2" onclick="toggleDayChip(this)">Sal</button>
            <button type="button" class="day-chip" data-day="3" onclick="toggleDayChip(this)">Çar</button>
            <button type="button" class="day-chip" data-day="4" onclick="toggleDayChip(this)">Per</button>
            <button type="button" class="day-chip" data-day="5" onclick="toggleDayChip(this)">Cum</button>
            <button type="button" class="day-chip" data-day="6" onclick="toggleDayChip(this)">Cmt</button>
            <button type="button" class="day-chip" data-day="0" onclick="toggleDayChip(this)">Paz</button>
          </div>
        </div>
        <div class="form-group">
          <label id="txt-label-routine-time"><i class="fa-regular fa-clock"></i> Saat</label>
          <input type="time" id="weeklyTime" value="09:00">
        </div>
        <button type="button" class="btn btn-primary btn-block" onclick="saveWeeklyRoutine()" id="txt-save-weekly-btn">Haftalık Rutini Kaydet</button>
      </div>
    </div>

    <!-- TAB 2: TARİHLİ / UZUN SÜRELİ PLAN TABLOSU -->
    <div id="dateTab" class="tab-content">
      <div class="card">
        <div class="form-group">
          <label id="txt-label-plan-name"><i class="fa-solid fa-pen"></i> Plan / Etkinlik Adı</label>
          <input type="text" id="datePlanName" placeholder="Örn: Doktor Randevusu, Tatil Planı">
        </div>
        <div class="form-group date-row">
          <div>
            <label id="txt-label-start-date">Başlangıç Tarihi</label>
            <input type="date" id="startDate">
          </div>
          <div>
            <label id="txt-label-end-date">Bitiş Tarihi</label>
            <input type="date" id="endDate">
          </div>
        </div>
        <div class="form-group">
          <label id="txt-label-plan-time"><i class="fa-regular fa-clock"></i> Saat</label>
          <input type="time" id="datePlanTime" value="14:00">
        </div>
        <button type="button" class="btn btn-primary btn-block" onclick="saveDatePlan()" id="txt-save-date-btn">Tarihli Planı Kaydet</button>
      </div>
    </div>

    <!-- BİRLEŞTİRİLMİŞ CANLI TAKVİM VE SAAT GÖRÜNÜMÜ -->
    <div class="card timeline-card" style="margin-top: 20px;">
      <div class="timeline-header">
        <h3 id="txt-title-timeline"><i class="fa-solid fa-clock-rotations"></i> Günlük Akış</h3>
        <input type="date" id="viewDate" onchange="renderCombinedView()">
      </div>
      <div id="combinedTimelineList"></div>
    </div>

    <!-- Banner Reklam -->
    <div class="ad-banner-area" id="adBannerArea">
      📢 <span id="txt-ad-placeholder">Sponsorlu Reklam Alanı (AdMob Banner)</span>
    </div>
  </div>

<script>
  let isAdsRemoved = localStorage.getItem('adsRemoved') === 'true';
  let weeklyRoutines = JSON.parse(localStorage.getItem('weeklyRoutines') || '[]');
  let datePlans = JSON.parse(localStorage.getItem('datePlans') || '[]');

  const translations = {
    tr: {
      appTitle: "Plan & Rutin Takip",
      removeAdsLabel: "Reklamları Kaldır ($0.99)",
      buyBtn: "Satın Al",
      tabWeekly: "Haftalık Rutinler",
      tabDate: "Tarihli / Uzun Planlar",
      labelRoutineName: "Rutin Adı",
      labelSelectDays: "Haftalık Gün Seçimi",
      labelRoutineTime: "Saat",
      saveWeeklyBtn: "Haftalık Rutini Kaydet",
      labelPlanName: "Plan / Etkinlik Adı",
      labelStartDate: "Başlangıç Tarihi",
      labelEndDate: "Bitiş Tarihi",
      labelPlanTime: "Saat",
      saveDateBtn: "Tarihli Planı Kaydet",
      titleTimeline: "Günlük Akış",
      adPlaceholder: "Sponsorlu Reklam Alanı (AdMob Banner)",
      daysShort: ["Paz", "Pzt", "Sal", "Çar", "Per", "Cum", "Cmt"],
      emptyTimeline: "Bu tarih için tanımlanmış bir rutin veya plan yok.",
      alertFill: "Lütfen gerekli alanları doldurun.",
      adsPurchased: "Teşekkürler! Reklamlar kaldırıldı."
    },
    en: {
      appTitle: "Plan & Routine Tracker",
      removeAdsLabel: "Remove Ads ($0.99)",
      buyBtn: "Buy Now",
      tabWeekly: "Weekly Routines",
      tabDate: "Dated / Long Plans",
      labelRoutineName: "Routine Name",
      labelSelectDays: "Select Days of Week",
      labelRoutineTime: "Time",
      saveWeeklyBtn: "Save Weekly Routine",
      labelPlanName: "Plan / Event Name",
      labelStartDate: "Start Date",
      labelEndDate: "End Date",
      labelPlanTime: "Time",
      saveDateBtn: "Save Dated Plan",
      titleTimeline: "Daily Timeline",
      adPlaceholder: "Sponsored Ad Space (AdMob Banner)",
      daysShort: ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"],
      emptyTimeline: "No routines or plans set for this date.",
      alertFill: "Please fill in all required fields.",
      adsPurchased: "Thank you! Ads have been removed."
    }
  };

  let currentLang = localStorage.getItem('appLang') || 'tr';

  function applyLanguage(lang) {
    currentLang = lang;
    localStorage.setItem('appLang', lang);
    document.getElementById('langSelect').value = lang;
    const t = translations[lang] || translations['tr'];

    document.getElementById('txt-app-title').innerText = t.appTitle;
    document.getElementById('txt-remove-ads-label').innerText = t.removeAdsLabel;
    document.getElementById('txt-buy-btn').innerText = t.buyBtn;
    document.getElementById('btn-tab-weekly').innerHTML = `<i class="fa-solid fa-arrows-rotate"></i> ${t.tabWeekly}`;
    document.getElementById('btn-tab-date').innerHTML = `<i class="fa-regular fa-calendar-plus"></i> ${t.tabDate}`;
    document.getElementById('txt-label-routine-name').innerHTML = `<i class="fa-solid fa-pen"></i> ${t.labelRoutineName}`;
    document.getElementById('txt-label-select-days').innerHTML = `<i class="fa-regular fa-calendar-check"></i> ${t.labelSelectDays}`;
    document.getElementById('txt-label-routine-time').innerHTML = `<i class="fa-regular fa-clock"></i> ${t.labelRoutineTime}`;
    document.getElementById('txt-save-weekly-btn').innerText = t.saveWeeklyBtn;
    document.getElementById('txt-label-plan-name').innerHTML = `<i class="fa-solid fa-pen"></i> ${t.labelPlanName}`;
    document.getElementById('txt-label-start-date').innerText = t.labelStartDate;
    document.getElementById('txt-label-end-date').innerText = t.labelEndDate;
    document.getElementById('txt-label-plan-time').innerHTML = `<i class="fa-regular fa-clock"></i> ${t.labelPlanTime}`;
    document.getElementById('txt-save-date-btn').innerText = t.saveDateBtn;
    document.getElementById('txt-title-timeline').innerHTML = `<i class="fa-solid fa-clock-rotations"></i> ${t.titleTimeline}`;
    document.getElementById('txt-ad-placeholder').innerText = t.adPlaceholder;

    document.querySelectorAll('.day-chip').forEach(chip => {
      chip.innerText = t.daysShort[parseInt(chip.getAttribute('data-day'))];
    });

    renderCombinedView();
  }

  function changeLanguage(lang) { applyLanguage(lang); }

  function toggleTheme() {
    const html = document.documentElement;
    const currentTheme = html.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    html.setAttribute('data-theme', currentTheme);
    document.getElementById('themeBtn').innerText = currentTheme === 'light' ? '🌙' : '☀️';
    localStorage.setItem('appTheme', currentTheme);
  }

  function initTheme() {
    const savedTheme = localStorage.getItem('appTheme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    document.getElementById('themeBtn').innerText = savedTheme === 'light' ? '🌙' : '☀️';
  }

  function switchTab(tabId) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    
    if(tabId === 'weeklyTab') {
      document.getElementById('btn-tab-weekly').classList.add('active');
    } else {
      document.getElementById('btn-tab-date').classList.add('active');
    }
    document.getElementById(tabId).classList.add('active');
  }

  function toggleDayChip(btn) { btn.classList.toggle('active'); }

  function saveWeeklyRoutine() {
    const name = document.getElementById('weeklyName').value.trim();
    const time = document.getElementById('weeklyTime').value;
    const t = translations[currentLang] || translations['tr'];

    let days = [];
    document.querySelectorAll('#weeklyTab .day-chip.active').forEach(chip => {
      days.push(parseInt(chip.getAttribute('data-day')));
    });

    if (!name || days.length === 0 || !time) return alert(t.alertFill);

    weeklyRoutines.push({ id: Date.now(), name, days, time });
    localStorage.setItem('weeklyRoutines', JSON.stringify(weeklyRoutines));

    document.getElementById('weeklyName').value = '';
    document.querySelectorAll('#weeklyTab .day-chip').forEach(c => c.classList.remove('active'));
    renderCombinedView();
  }

  function saveDatePlan() {
    const name = document.getElementById('datePlanName').value.trim();
    const startDate = document.getElementById('startDate').value;
    const endDate = document.getElementById('endDate').value;
    const time = document.getElementById('datePlanTime').value;
    const t = translations[currentLang] || translations['tr'];

    if (!name || !startDate || !endDate || !time) return alert(t.alertFill);

    datePlans.push({ id: Date.now(), name, startDate, endDate, time });
    localStorage.setItem('datePlans', JSON.stringify(datePlans));

    document.getElementById('datePlanName').value = '';
    renderCombinedView();
  }

  function deleteItem(type, id) {
    if(type === 'weekly') {
      weeklyRoutines = weeklyRoutines.filter(r => r.id !== id);
      localStorage.setItem('weeklyRoutines', JSON.stringify(weeklyRoutines));
    } else {
      datePlans = datePlans.filter(p => p.id !== id);
      localStorage.setItem('datePlans', JSON.stringify(datePlans));
    }
    renderCombinedView();
  }

  function renderCombinedView() {
    const viewDateVal = document.getElementById('viewDate').value;
    if(!viewDateVal) return;

    const selectedDate = new Date(viewDateVal + 'T00:00:00');
    const dayOfWeek = selectedDate.getDay(); // 0: Paz, 1: Pzt...
    const t = translations[currentLang] || translations['tr'];

    let combined = [];

    // 1. Haftalık Rutinlerden Uyanları Çek
    weeklyRoutines.forEach(r => {
      if(r.days.includes(dayOfWeek)) {
        combined.push({ type: 'weekly', id: r.id, name: r.name, time: r.time, badge: t.tabWeekly });
      }
    });

    // 2. Tarihli / Uzun Süreli Planlardan Uyanları Çek
    datePlans.forEach(p => {
      if(viewDateVal >= p.startDate && viewDateVal <= p.endDate) {
        combined.push({ type: 'date', id: p.id, name: p.name, time: p.time, badge: t.tabDate });
      }
    });

    // Saat Sırasına Diz
    combined.sort((a, b) => a.time.localeCompare(b.time));

    const listContainer = document.getElementById('combinedTimelineList');
    listContainer.innerHTML = '';

    if(combined.length === 0) {
      listContainer.innerHTML = `<div class="empty-msg">${t.emptyTimeline}</div>`;
      return;
    }

    combined.forEach(item => {
      const div = document.createElement('div');
      div.className = 'timeline-item';
      div.innerHTML = `
        <div class="time-badge"><i class="fa-regular fa-clock"></i> ${item.time}</div>
        <div class="timeline-content">
          <div class="timeline-title">${item.name}</div>
          <span class="type-tag ${item.type}">${item.badge}</span>
        </div>
        <button class="delete-btn" onclick="deleteItem('${item.type}', ${item.id})"><i class="fa-solid fa-trash"></i></button>
      `;
      listContainer.appendChild(div);
    });
  }

  function buyRemoveAds() {
    const t = translations[currentLang] || translations['tr'];
    localStorage.setItem('adsRemoved', 'true');
    isAdsRemoved = true;
    checkAdsStatus();
    alert(t.adsPurchased);
  }

  function checkAdsStatus() {
    if (isAdsRemoved) {
      document.getElementById('removeAdsBar').style.display = 'none';
      document.getElementById('adBannerArea').style.display = 'none';
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    initTheme();
    const todayStr = new Date().toISOString().split('T')[0];
    document.getElementById('viewDate').value = todayStr;
    document.getElementById('startDate').value = todayStr;
    document.getElementById('endDate').value = todayStr;
    
    applyLanguage(currentLang);
    checkAdsStatus();
  });
</script>
</body>
</html>
