<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Habit Tracker</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f4f6f8; margin: 0; padding: 20px; color: #333; }
    .container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    h1 { text-align: center; color: #2c3e50; font-size: 24px; margin-top: 0; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 14px; }
    input[type="text"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
    .time-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
    .time-row input[type="time"] { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 6px; }
    .remove-time-btn { background: #e74c3c; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; }
    .add-time-btn { background: #3498db; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; width: 100%; margin-top: 5px; }
    .submit-btn { background: #2ecc71; color: white; border: none; width: 100%; padding: 12px; font-size: 16px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 15px; }
    .habit-card { background: #f8f9fa; border-left: 4px solid #2ecc71; padding: 12px; margin-top: 10px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
    .habit-title { font-weight: bold; }
    .habit-times { font-size: 12px; color: #666; }
  </style>
</head>
<body>

<div class="container">
  <h1>Daily Habit Tracker</h1>

  <div class="form-group">
    <label for="habitName">Etkinlik / Alışkanlık Adı</label>
    <input type="text" id="habitName" placeholder="Örn: Kitap Oku, Su İç">
  </div>

  <div class="form-group">
    <label>Hatırlatma Saatleri (Çoklu Seçim)</label>
    <div id="timeList">
      <div class="time-row">
        <input type="time" class="habit-time-input" value="09:00">
      </div>
    </div>
    <button type="button" class="add-time-btn" onclick="addTimeSlot()">+ Başka Saat Ekle</button>
  </div>

  <button type="button" class="submit-btn" onclick="saveHabit()">Etkinliği ve Bildirimleri Kaydet</button>

  <h3 style="margin-top: 25px;">Kayıtlı Etkinlikler</h3>
  <div id="habitList"></div>
</div>

<script>
  // Saat Ekleme Butonu
  function addTimeSlot() {
    const container = document.getElementById('timeList');
    const div = document.createElement('div');
    div.className = 'time-row';
    div.innerHTML = `
      <input type="time" class="habit-time-input" value="12:00">
      <button type="button" class="remove-time-btn" onclick="this.parentElement.remove()">X</button>
    `;
    container.appendChild(div);
  }

  // Bildirim Kurma Fonksiyonu (Capacitor Local Notifications)
  async function scheduleNotification(title, timeStr) {
    if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.LocalNotifications) {
      const { LocalNotifications } = window.Capacitor.Plugins;
      
      try {
        await LocalNotifications.requestPermissions();

        const [hours, minutes] = timeStr.split(':').map(Number);
        const now = new Date();
        const scheduledDate = new Date();
        scheduledDate.setHours(hours, minutes, 0, 0);

        // Eğer belirlenen saat geçmişse yarına kur
        if (scheduledDate <= now) {
          scheduledDate.setDate(scheduledDate.getDate() + 1);
        }

        const notifId = Math.floor(Math.random() * 1000000);

        await LocalNotifications.schedule({
          notifications: [
            {
              title: "Hatırlatıcı: " + title,
              body: "Etkinlik saatiniz geldi!",
              id: notifId,
              schedule: { at: scheduledDate },
              sound: null,
              attachments: null,
              actionTypeId: "",
              extra: null
            }
          ]
        });
      } catch (err) {
        console.log("Bildirim Hatası:", err);
      }
    }
  }

  // Etkinlik Kaydetme
  async function saveHabit() {
    const name = document.getElementById('habitName').value.trim();
    if (!name) {
      alert("Lütfen bir etkinlik adı girin.");
      return;
    }

    const timeInputs = document.querySelectorAll('.habit-time-input');
    const times = [];
    
    for (let input of timeInputs) {
      if (input.value) {
        times.push(input.value);
        await scheduleNotification(name, input.value);
      }
    }

    if (times.length === 0) {
      alert("Lütfen en az bir saat seçin.");
      return;
    }

    // Ekran Listesine Ekle
    const habitList = document.getElementById('habitList');
    const card = document.createElement('div');
    card.className = 'habit-card';
    card.innerHTML = `
      <div>
        <div class="habit-title">${name}</div>
        <div class="habit-times">Saatler: ${times.join(', ')}</div>
      </div>
      <span style="color: #2ecc71; font-weight: bold;">✓ Bildirim Kuruldu</span>
    `;
    habitList.appendChild(card);

    // Formu temizle
    document.getElementById('habitName').value = '';
    alert("Etkinlik ve seçilen tüm saatler için bildirimler başarıyla ayarlandı!");
  }
</script>

</body>
</html>
