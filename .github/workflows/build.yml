name: Build Android App

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: Initialize Package JSON if Missing
      run: |
        if [ ! -f package.json ]; then
          npm init -y
        fi

    - name: Install Dependencies
      run: |
        npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor-community/admob @capacitor/local-notifications

    - name: Prepare Web Assets Folder (www)
      run: |
        mkdir -p www
        rsync -av --exclude='node_modules' --exclude='.git' --exclude='.github' --exclude='android' --exclude='www' ./ www/

    - name: Generate Capacitor Config & Android Project
      run: |
        cat <<EOF > capacitor.config.json
        {
          "appId": "com.daily.habit.tracker",
          "appName": "Daily Habit Tracker",
          "webDir": "www",
          "bundledWebRuntime": false
        }
        EOF
        npx cap add android || true
        npx cap sync android

    - name: Inject AdMob App ID to Manifest
      run: |
        MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
        if [ -f "$MANIFEST_PATH" ]; then
          sed -i '/<\/application>/i \    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-6791068479641990~5580412508 "/>' $MANIFEST_PATH
        fi

    - name: Build APK and AAB
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleRelease
        ./gradlew bundleRelease

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: App-Release-APK
        path: android/app/build/outputs/apk/release/app-release-unsigned.apk

    - name: Upload AAB (Play Console)
      uses: actions/upload-artifact@v4
      with:
        name: App-Release-AAB
        path: android/app/build/outputs/bundle/release/app-release.aab
