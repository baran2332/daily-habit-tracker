name: Build Android App (AAB & APK)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 1. Proje içindeki gradlew dosyasını bul
      - name: Locate Gradlew Project
        id: locate
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "HATA: Repoda gradlew dosyası bulunamadı! Lütfen android klasörünü kontrol edin."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Android dizini bulundu: $PROJECT_DIR"

      # 2. AdMob App ID Inject
      - name: Inject AdMob App ID
        run: |
          ADMOB_ID="ca-app-pub-6791068479641990~5580412508" # <-- ADMOB APP ID'Nİ BURAYA YAZ
          find ${{ env.PROJECT_DIR }} -name "AndroidManifest.xml" -exec sed -i "s/YOUR_ADMOB_APP_ID/$ADMOB_ID/g" {} + || true

      # 3. Android SDK Hazırla
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4. Gradlew Çalıştırma İzni Ver
      - name: Grant Execute Permission for Gradlew
        run: |
          chmod +x ${{ env.PROJECT_DIR }}/gradlew

      # 5. Hem AAB Hem APK Derleme
      - name: Build Release Bundle & APK
        run: |
          cd ${{ env.PROJECT_DIR }}
          ./gradlew bundleRelease assembleRelease

      # 6. Android Keystore Deşifre Et
      - name: Decode Keystore
        run: |
          KEYSTORE_DIR=$(find ${{ env.PROJECT_DIR }} -type d -name "app" | head -n 1)
          if [ -z "$KEYSTORE_DIR" ]; then KEYSTORE_DIR="${{ env.PROJECT_DIR }}/app"; fi
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$KEYSTORE_DIR/release.keystore"

      # 7. AAB İmzala (Google Play için)
      - name: Sign AAB
        run: |
          AAB_FILE=$(find ${{ env.PROJECT_DIR }} -name "app-release.aab" -o -name "*-release.aab" | head -n 1)
          KEYSTORE_FILE=$(find ${{ env.PROJECT_DIR }} -name "release.keystore" | head -n 1)
          OUT_AAB="$(dirname $AAB_FILE)/app-release-signed.aab"
          
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks "$KEYSTORE_FILE" \
            --ks-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --key-pass pass:"${{ secrets.KEY_PASSWORD }}" \
            --out "$OUT_AAB" \
            "$AAB_FILE"

      # 8. APK İmzala (Tablet Testi için)
      - name: Sign APK
        run: |
          APK_FILE=$(find ${{ env.PROJECT_DIR }} -name "app-release-unsigned.apk" -o -name "app-release.apk" -o -name "*-release-unsigned.apk" | head -n 1)
          KEYSTORE_FILE=$(find ${{ env.PROJECT_DIR }} -name "release.keystore" | head -n 1)
          OUT_APK="$(dirname $APK_FILE)/app-release-signed.apk"

          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks "$KEYSTORE_FILE" \
            --ks-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --key-pass pass:"${{ secrets.KEY_PASSWORD }}" \
            --out "$OUT_APK" \
            "$APK_FILE"

      # 9. AAB Artifact Yükle
      - name: Upload Signed AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: App-Release-AAB
          path: "**/app-release-signed.aab"

      # 10. APK Artifact Yükle
      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: App-Release-APK
          path: "**/app-release-signed.apk"
