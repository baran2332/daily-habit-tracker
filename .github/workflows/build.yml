name: Build Android App (AAB & APK)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          if [ -f "package.json" ]; then
            npm install
          fi

      # AdMob App ID Inject
      - name: Inject AdMob App ID
        run: |
          ADMOB_ID="ca-app-pub-6791068479641990~5580412508" # <-- ADMOB APP ID'Nİ BURAYA YAZ
          find . -name "AndroidManifest.xml" -exec sed -i "s/YOUR_ADMOB_APP_ID/$ADMOB_ID/g" {} + || true

      - name: Build Web Assets
        run: |
          if [ -f "package.json" ]; then
            npm run build --if-present
          fi

      - name: Sync Capacitor Android
        run: |
          if [ -f "package.json" ]; then
            npx cap sync android || true
          fi

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Gradlew izinlerini dinamik ayarlama
      - name: Grant Execute Permission for Gradlew
        run: |
          find . -name "gradlew" -exec chmod +x {} +

      # Hem AAB hem APK derleme
      - name: Build Release Bundle & APK
        run: |
          if [ -d "android" ]; then
            cd android
          fi
          ./gradlew bundleRelease assembleRelease

      # Android Keystore Deşifre Etme
      - name: Decode Keystore
        run: |
          KEYSTORE_DIR=$(find . -type d -name "app" | head -n 1)
          if [ -z "$KEYSTORE_DIR" ]; then KEYSTORE_DIR="android/app"; fi
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$KEYSTORE_DIR/release.keystore"

      # AAB İmzalama (Play Console için)
      - name: Sign AAB
        run: |
          AAB_FILE=$(find . -name "app-release.aab" | head -n 1)
          KEYSTORE_FILE=$(find . -name "release.keystore" | head -n 1)
          OUT_AAB="$(dirname $AAB_FILE)/app-release-signed.aab"
          
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks "$KEYSTORE_FILE" \
            --ks-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --key-pass pass:"${{ secrets.KEY_PASSWORD }}" \
            --out "$OUT_AAB" \
            "$AAB_FILE"

      # APK İmzalama (Tablet Testi için)
      - name: Sign APK
        run: |
          APK_FILE=$(find . -name "app-release-unsigned.apk" -o -name "app-release.apk" | head -n 1)
          KEYSTORE_FILE=$(find . -name "release.keystore" | head -n 1)
          OUT_APK="$(dirname $APK_FILE)/app-release-signed.apk"

          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks "$KEYSTORE_FILE" \
            --ks-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --key-pass pass:"${{ secrets.KEY_PASSWORD }}" \
            --out "$OUT_APK" \
            "$APK_FILE"

      # AAB Artifact Yükleme
      - name: Upload Signed AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: App-Release-AAB
          path: "**/app-release-signed.aab"

      # APK Artifact Yükleme
      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: App-Release-APK
          path: "**/app-release-signed.apk"
