name: Build Android App (AAB & APK)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # package.json dosyasını bulamazsa bile derlemeyi durdurmaz
      - name: Install Dependencies
        run: |
          if [ -f "package.json" ]; then
            npm install
          else
            echo "package.json bulunamadı, varsayılan yapıya devam ediliyor."
          fi

      # AdMob App ID'sini AndroidManifest.xml İçine Yerleştirme
      - name: Inject AdMob App ID
        run: |
          ADMOB_ID="ca-app-pub-6791068479641990~5580412508" # <-- ADMOB APP ID'Nİ BURAYA YAZ
          if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
            sed -i "s/YOUR_ADMOB_APP_ID/$ADMOB_ID/g" android/app/src/main/AndroidManifest.xml || true
          fi

      - name: Build Web Assets
        run: |
          if [ -f "package.json" ]; then
            npm run build --if-present
          fi

      - name: Sync Capacitor Android
        run: |
          if [ -f "package.json" ]; then
            npx cap sync android || true
          fi

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      # Hem Play Console (.aab) hem cihaz testi (.apk) derler
      - name: Build Release Bundle & APK
        run: |
          cd android
          ./gradlew bundleRelease assembleRelease

      # Android Keystore Deşifre Etme
      - name: Decode Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore

      # AAB İmzalama (Google Play Console için)
      - name: Sign AAB
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks android/app/release.keystore \
            --ks-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --key-pass pass:"${{ secrets.KEY_PASSWORD }}" \
            --out android/app/build/outputs/bundle/release/app-release-signed.aab \
            android/app/build/outputs/bundle/release/app-release.aab

      # APK İmzalama (Tabletinde Test Etmek İçin)
      - name: Sign APK
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks android/app/release.keystore \
            --ks-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --key-pass pass:"${{ secrets.KEY_PASSWORD }}" \
            --out android/app/build/outputs/apk/release/app-release-signed.apk \
            android/app/build/outputs/apk/release/app-release-unsigned.apk || \
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks android/app/release.keystore \
            --ks-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --key-pass pass:"${{ secrets.KEY_PASSWORD }}" \
            --out android/app/build/outputs/apk/release/app-release-signed.apk \
            android/app/build/outputs/apk/release/app-release.apk

      # AAB Yükleme (Play Console)
      - name: Upload Signed AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: App-Release-AAB
          path: android/app/build/outputs/bundle/release/app-release-signed.aab

      # APK Yükleme (Cihaz Testi)
      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: App-Release-APK
          path: android/app/build/outputs/apk/release/app-release-signed.apk
