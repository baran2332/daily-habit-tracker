name: Build Android AAB

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Prepare Web Assets & Ensure index.html
        run: |
          mkdir -p www
          # Tüm web dosyalarını bulup www içine taşı
          find . -maxdepth 1 -type f \( -name "*.html" -o -name "*.js" -o -name "*.css" \) -exec cp {} www/ \;
          
          # Eğer index.html adı büyük harfle yazıldıysa düzelt
          if [ -f www/Index.html ] && [ ! -f www/index.html ]; then
            mv www/Index.html www/index.html
          fi

          # Eğer www içinde hiç index.html yoksa kök dizinden zorla kopyala
          if [ ! -f www/index.html ]; then
            cp index.html www/ 2>/dev/null || cp Index.html www/ 2>/dev/null || true
          fi

          # Kontrol için dosyaları listele
          ls -la www/

      - name: Initialize Project & Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Initialize Capacitor Config
        run: |
          npx cap init "Daily Tracker" "com.dailyhabit.tracker" --web-dir www

      - name: Add Android Platform & Sync
        run: |
          npx cap add android
          npx cap sync android

      - name: Build Android Release Bundle (AAB)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: android/app/build/outputs/bundle/release/app-release.aab
