name: Build Android App (AAB & APK)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Proje Dizinini Otomatik Tespit Et
      - name: Find Project Directory
        id: proj
        run: |
          PKG_PATH=$(find . -maxdepth 3 -name "package.json" | head -n 1)
          if [ -z "$PKG_PATH" ]; then
            echo "HATA: package.json bulunamadı!"
            exit 1
          fi
          DIR=$(dirname "$PKG_PATH")
          echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV
          echo "Proje dizini: $DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 2. Bağımlılıkları Yükle
      - name: Install Dependencies
        run: |
          cd ${{ env.PROJECT_DIR }}
          npm install

      # 3. Web Paketini Derle
      - name: Build Web Assets
        run: |
          cd ${{ env.PROJECT_DIR }}
          npm run build --if-present

      # 4. Android Yerel Klasörünü Oluştur ve Senkronize Et
      - name: Add and Sync Android Platform
        run: |
          cd ${{ env.PROJECT_DIR }}
          npx cap add android || true
          npx cap sync android

      # 5. AdMob App ID Inject
      - name: Inject AdMob App ID
        run: |
          ADMOB_ID="ca-app-pub-6791068479641990~5580412508" # <-- ADMOB APP ID'Nİ BURAYA YAZ
          find ${{ env.PROJECT_DIR }}/android/ -name "AndroidManifest.xml" -exec sed -i "s/YOUR_ADMOB_APP_ID/$ADMOB_ID/g" {} + || true

      # 6. Android SDK Hazırla
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 7. Gradlew İzinlerini Ver
      - name: Grant Execute Permission for Gradlew
        run: |
          cd ${{ env.PROJECT_DIR }}/android
          chmod +x gradlew

      # 8. Hem AAB Hem APK Derleme
      - name: Build Release Bundle & APK
        run: |
          cd ${{ env.PROJECT_DIR }}/android
          ./gradlew bundleRelease assembleRelease

      # 9. Android Keystore Deşifre Et
      - name: Decode Keystore
        run: |
          cd ${{ env.PROJECT_DIR }}
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore

      # 10. AAB İmzala (Play Console)
      - name: Sign AAB
        run: |
          cd ${{ env.PROJECT_DIR }}
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks android/app/release.keystore \
            --ks-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --key-pass pass:"${{ secrets.KEY_PASSWORD }}" \
            --out android/app/build/outputs/bundle/release/app-release-signed.aab \
            android/app/build/outputs/bundle/release/app-release.aab

      # 11. APK İmzala (Tablet Testi)
      - name: Sign APK
        run: |
          cd ${{ env.PROJECT_DIR }}
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks android/app/release.keystore \
            --ks-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --key-pass pass:"${{ secrets.KEY_PASSWORD }}" \
            --out android/app/build/outputs/apk/release/app-release-signed.apk \
            android/app/build/outputs/apk/release/app-release-unsigned.apk || \
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks android/app/release.keystore \
            --ks-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --key-pass pass:"${{ secrets.KEY_PASSWORD }}" \
            --out android/app/build/outputs/apk/release/app-release-signed.apk \
            android/app/build/outputs/apk/release/app-release.apk

      # 12. AAB Artifact Yükle
      - name: Upload Signed AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: App-Release-AAB
          path: "**/app-release-signed.aab"

      # 13. APK Artifact Yükle
      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: App-Release-APK
          path: "**/app-release-signed.apk"
