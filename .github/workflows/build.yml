name: Build Android App (AAB & APK)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      # AdMob App ID'sini AndroidManifest.xml İçine Otomatik Yerleştirme
      - name: Inject AdMob App ID
        run: |
          ADMOB_ID="ca-app-pub-6791068479641990~5580412508" # <-- ADMOB APP ID'Nİ BURAYA YAZ
          sed -i "s/YOUR_ADMOB_APP_ID/$ADMOB_ID/g" android/app/src/main/AndroidManifest.xml || true

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      # Hem Play Console için .aab hem cihaz testi için .apk üretir
      - name: Build Release Bundle & APK
        run: |
          cd android
          ./gradlew bundleRelease assembleRelease

      # Android Keystore Deşifre Etme
      - name: Decode Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore

      # AAB İmzalama (Google Play Console için)
      - name: Sign AAB
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks android/app/release.keystore \
            --ks-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --key-pass pass:"${{ secrets.KEY_PASSWORD }}" \
            --out android/app/build/outputs/bundle/release/app-release-signed.aab \
            android/app/build/outputs/bundle/release/app-release.aab

      # APK İmzalama (Tabletinde Test Etmek İçin)
      - name: Sign APK
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks android/app/release.keystore \
            --ks-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --key-pass pass:"${{ secrets.KEY_PASSWORD }}" \
            --out android/app/build/outputs/apk/release/app-release-signed.apk \
            android/app/build/outputs/apk/release/app-release-unsigned.apk || \
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks android/app/release.keystore \
            --ks-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --key-pass pass:"${{ secrets.KEY_PASSWORD }}" \
            --out android/app/build/outputs/apk/release/app-release-signed.apk \
            android/app/build/outputs/apk/release/app-release.apk

      # AAB Dosyasını Yükle (Play Console için)
      - name: Upload Signed AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: App-Release-AAB
          path: android/app/build/outputs/bundle/release/app-release-signed.aab

      # APK Dosyasını Yükle (Cihaz Kurulumu için)
      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: App-Release-APK
          path: android/app/build/outputs/apk/release/app-release-signed.apk
