name: Build Android AAB

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Prepare Web Assets
        run: |
          mkdir -p www
          # Mevcut tüm dosyaları www içine kopyala
          cp -r * www/ 2>/dev/null || true
          
          # Eğer www içinde index.html yoksa varsayılan bir tane oluştur
          if [ ! -f www/index.html ]; then
            echo '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Daily Tracker</title></head><body><h1>Daily Habit Tracker</h1><script src="app.js"></script></body></html>' > www/index.html
          fi

      - name: Initialize Project & Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Initialize Capacitor Config
        run: |
          npx cap init "Daily Tracker" "com.dailyhabit.tracker" --web-dir www

      - name: Add Android Platform & Sync
        run: |
          npx cap add android
          npx cap sync android

      - name: Build Android Release Bundle (AAB)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: android/app/build/outputs/bundle/release/app-release.aab
